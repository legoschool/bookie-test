name: Inspect brochure correction
on:
  push:
    branches: [fix-brochure-typos-20261027]
    paths: ['.github/workflows/brochure-correction.yml', 'tools/brochure-correction.py']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF Pillow
      - run: python tools/brochure-correction.py
      - name: Save review files on correction branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add correction-review promo/bro/reading-20261026 promo/dl/brochure
          git diff --cached --quiet || git commit -m "Prepare brochure correction review"
          git push origin HEAD:fix-brochure-typos-20261027
