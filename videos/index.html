<!DOCTYPE html>
<!--
  부기 홍보 영상 모음 (videos/) · 혼자 서는 정적 페이지입니다.
  영상 목록은 data.js 하나가 정합니다. data.js 는 build_data.py 가 만듭니다.
  영상은 구글 드라이브 공유 파일을 드라이브 재생 화면(iframe)으로 띄웁니다.
  모든 경로가 상대 경로라서 폴더째 다른 사이트(메인 등)에 옮겨도 그대로 돌아갑니다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부기 홍보 영상</title>
<meta name="description" content="교실을 위한 어린이 명작 도서관, 부기. 15초 광고부터 2분 소개까지 홍보 영상을 한곳에 모았습니다.">
<link rel="icon" href="assets/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="theme-color" content="#1d3a2a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="부기">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="부기 홍보 영상">
<meta property="og:description" content="교실을 위한 어린이 명작 도서관, 부기. 15초 광고부터 2분 소개까지 홍보 영상을 한곳에 모았습니다.">
<meta property="og:url" content="https://legoschool.github.io/bookie-test/videos/">
<meta property="og:image" content="https://legoschool.github.io/bookie-test/videos/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261007">
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <a class="mark" href="#top" aria-label="맨 위로"><img src="assets/pair.png" alt=""><span class="nm">부기</span><span class="sub">홍보 영상</span></a>
    <nav id="nav" aria-label="영상 갈래"></nav>
    <a class="hd-go" id="goLink" href="https://bookie.io.kr/?intro=skip" target="_blank" rel="noopener">부기 바로가기</a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-in">
      <div class="hero-tx">
      <p class="kick">부기 홍보 영상 모음</p>
      <h1>읽고, 묻고,<br><span class="hl">스스로 생각하는</span> 아이로</h1>
      <p class="lead">부기는 교실을 위한 어린이 명작 도서관입니다. 15초 광고부터 2분 소개까지, 학교와 가정에 소개할 때 쓰는 영상을 한곳에 모았습니다.</p>
      <div class="hero-cta">
        <button class="btn" type="button" id="heroPlay"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>대표 영상 보기</button>
        <a class="ghost" href="https://bookie.io.kr/?intro=skip" target="_blank" rel="noopener">부기 바로가기 →</a>
      </div>
      </div>
      <div class="hero-art" id="heroArt" aria-hidden="true"></div>
    </div>
    <div class="hstats"><div class="wrap hstats-in" id="stats"></div></div>
  </section>

  <div id="sections"></div>
</main>

<footer class="ft">
  <div class="wrap ft-in">
    <p><strong>부기</strong> · 교실을 위한 어린이 명작 도서관 · <a href="https://bookie.io.kr/?intro=skip" target="_blank" rel="noopener">bookie.io.kr</a></p>
    <p class="note">영상은 구글 드라이브에서 재생됩니다. 영상마다 가로·세로 화면과 끝화면(QR·앱스토어)을 골라 볼 수 있고, 내려받아 게시글·광고에 그대로 쓸 수 있습니다. <span id="updated"></span></p>
  </div>
</footer>

<dialog class="pl" id="player" aria-labelledby="plTitle">
  <div class="pl-box">
    <div class="pl-top">
      <div>
        <p class="pl-kick" id="plKick"></p>
        <h2 id="plTitle"></h2>
      </div>
      <button class="pl-x" type="button" id="plClose" aria-label="닫기"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="pl-stage" id="plStage"></div>
    <div class="pl-opts" id="plOpts"></div>
    <p class="pl-desc" id="plDesc"></p>
    <div class="pl-acts">
      <a class="act" id="plOpen" target="_blank" rel="noopener">드라이브에서 열기</a>
      <a class="act" id="plDown" target="_blank" rel="noopener">내려받기</a>
      <button class="act" type="button" id="plCopy">이 영상 주소 복사</button>
      <span class="pl-msg" id="plMsg" role="status"></span>
    </div>
  </div>
</dialog>

<script src="data.js?v=20261007"></script>
<script src="app.js?v=20261007"></script>
</body>
</html>
